kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mlops-andrey11
networking:
  ipFamily: ipv4
  kubeProxyMode: nftables
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        controllerManager:
          extraArgs:
            horizontal-pod-autoscaler-sync-period: '10s'
